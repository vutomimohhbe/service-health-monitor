{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  <p class="muted">Use your current password to confirm this change. Other active sessions will be signed out.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>New password (10-128 characters)
      <input type="password" name="new_password" required minlength="10" maxlength="128" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10" maxlength="128" autocomplete="new-password">
    </label>
    <button>Change password</button>
  </form>
</section>
{% endblock %}
