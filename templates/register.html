{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" autocomplete="username"></label>
    <label>Password (min 10 chars) <input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <button>Register</button>
  </form>
</section>
{% endblock %}
